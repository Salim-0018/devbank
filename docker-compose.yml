services:

  mysql:
    image: mysql:8.4
    container_name: devbank-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: devbank
      MYSQL_USER: devbank
      MYSQL_PASSWORD: devbankpassword
    volumes:
      - devbank_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "devbank", "-pdevbankpassword"]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: ./backend
    container_name: devbank-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_PORT: 
      DB_HOST: mysql
      DB_USER: devbank
      DB_PASSWORD: devbankpassword
      DB_NAME: devbank
      JWT_SECRET: devbank_super_secret_change_this
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: devbank-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend


volumes:
  devbank_mysql_data:
